<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toko Akun Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <h1 class="text-3xl font-bold text-center mb-4">Toko Akun Game Kenzo.ID</h1>

  <!-- Search and Category -->
  <div class="flex flex-col sm:flex-row items-center justify-between mb-6 max-w-5xl mx-auto">
    <input type="text" id="searchInput" placeholder="Cari akun..." class="w-full sm:w-1/2 px-4 py-2 rounded border border-gray-300 mb-2 sm:mb-0"/>
    <select id="categorySelect" class="w-full sm:w-1/4 px-4 py-2 rounded border border-gray-300 ml-0 sm:ml-4">
      <option value="all">Semua Kategori</option>
      <option value="ML">Mobile Legends</option>
      <option value="FF">Free Fire</option>
      <option value="PUBG">PUBG</option>
    </select>
  </div>

  <!-- Container Akun -->
  <div id="accountContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 max-w-6xl mx-auto">
    <!-- Data akan di-generate lewat JavaScript -->
  </div>

  <script src="script.js"></script>
</body>
</html>
